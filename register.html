<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="register-form" class="form">
    <h2>Inscription</h2>
    <input type="text" name="nom" placeholder="Nom" required>
    <input type="text" name="prenom" placeholder="Prénom" required>
    <select name="genre" required>
      <option value="">Genre</option>
      <option value="Homme">Homme</option>
      <option value="Femme">Femme</option>
      <option value="Autre">Autre</option>
    </select>
    <input type="date" name="date_naissance" required>
    <input type="text" name="lieu" placeholder="Lieu de naissance" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Mot de passe" minlength="6" required>
    <button type="submit" class="btn">S'inscrire</button>
    <a href="login.html" class="btn secondary form-link">Déjà inscrit ? Connexion</a>
    <a href="index.html" class="home-link">← Retour au studio</a>
    <p id="auth-message" class="status-info"></p>
  </form>

  <script src="auth.js"></script>
</body>
</html>
