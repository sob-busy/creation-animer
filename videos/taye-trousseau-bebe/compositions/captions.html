    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;

  .caption-group {

    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;

  .caption-pill {

  }

    background: var(--cap-accent, #f8635f);
